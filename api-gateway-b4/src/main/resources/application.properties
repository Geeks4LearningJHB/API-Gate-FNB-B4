# ===============================
# Application Identity
# ===============================
spring.application.name=api-gateway-b4

# ===============================
# Config Server Import
# ===============================
# 'optional:' means the app will still start even if no config server is found.
# Once you have a real config server running, change the URL below (or remove
# 'optional:' if you want the app to FAIL when the config server is unreachable).
spring.config.import=optional:configserver:http://localhost:8888

# ===============================
# Server Settings
# ===============================
server.port=8080

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.cloud=DEBUG
logging.level.com.example.api_gateway_b4=DEBUG

# ===============================
# Actuator (optional but handy for gateways)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# User Management Microservice Target URL
# ===============================
# Local default: http://localhost:8092
# Override with USER_SERVICE_URL env var on Render (e.g. https://fnb-b4-ibs-user-service.onrender.com)
user.service.url=${USER_SERVICE_URL:http://localhost:8092}

# ===============================
# Spring Cloud Gateway Global CORS
# ===============================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization,Content-Disposition
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ===============================
# HTTP Client Timeouts
# ===============================
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=15s