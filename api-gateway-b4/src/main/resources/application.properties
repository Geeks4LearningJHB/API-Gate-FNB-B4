# ===============================
# Application Identity
# ===============================
spring.application.name=api-gateway-b4

# ===============================
# Config Server Import
# ===============================
# 'optional:' means the app will still start even if no config server is found.
# Once you have a real config server running, change the URL below (or remove
# 'optional:' if you want the app to FAIL when the config server is unreachable).
spring.config.import=optional:configserver:http://localhost:8888

# ===============================
# Server Settings
# ===============================
server.port=8080

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.cloud=DEBUG
logging.level.com.example.api_gateway_b4=DEBUG

# ===============================
# Actuator (optional but handy for gateways)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always